# Local:      docker compose up   ->  http://localhost:8080
# Codespaces: opens automatically (see .devcontainer/devcontainer.json)
services:
  app:
    build: ./docker
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: crm_giabao
      DB_USER: crm
      DB_PASS: crm_demo_pass
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      db:
        condition: service_healthy
  db:
    # 10.4 matches the tested XAMPP version. Newer MariaDB/MySQL reject a CHECK on a column used by a cascading FK.
    image: mariadb:10.4
    environment:
      MARIADB_ROOT_PASSWORD: root_demo_pass
      MARIADB_DATABASE: crm_giabao
      MARIADB_USER: crm
      MARIADB_PASSWORD: crm_demo_pass
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./sql/crm_giabao.sql:/docker-entrypoint-initdb.d/01-crm_giabao.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -ucrm -pcrm_demo_pass -e \"SELECT 1 FROM crm_giabao.contact_history LIMIT 1\""]
      interval: 5s
      timeout: 5s
      retries: 30
